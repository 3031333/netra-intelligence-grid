version: '3.8'

services:
  # --- 1. THE RELATIONAL DATABASE ---
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: NETRA_SECURE_PASSWORD_2026
      POSTGRES_DB: netra_core
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d netra_core"]
      interval: 5s
      retries: 5

  # --- 2. THE VECTOR DATABASE ---
  qdrant_db:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # --- 3. YOUR FASTAPI BACKEND ---
  web_api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy
      qdrant_db:
        condition: service_started

volumes:
  pg_data:
  qdrant_data: